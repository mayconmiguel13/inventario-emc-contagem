<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a192f"/>
      <stop offset="50%" stop-color="#071224"/>
      <stop offset="100%" stop-color="#030914"/>
    </linearGradient>

    <!-- Shield Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="40%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Emerald Green Gradient -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Cyan Glow -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- App Squircle Base -->
  <rect width="512" height="512" rx="116" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="112" fill="none" stroke="url(#cyanGrad)" stroke-width="3" stroke-opacity="0.4"/>

  <!-- Subtle Circuit / Grid Pattern in background -->
  <g opacity="0.12" stroke="#38bdf8" stroke-width="2" fill="none">
    <circle cx="256" cy="256" r="210"/>
    <circle cx="256" cy="256" r="160" stroke-dasharray="8 8"/>
    <path d="M 46 256 H 466 M 256 46 V 466"/>
  </g>

  <!-- Civic / Asset Main Shield with Shadow -->
  <g filter="url(#shadow)">
    <!-- Shield Outer Gold Rim -->
    <path d="M 256 72 
             C 340 72, 386 100, 396 156 
             C 400 240, 360 350, 256 428 
             C 152 350, 112 240, 116 156 
             C 126 100, 172 72, 256 72 Z"
          fill="none" stroke="url(#goldGrad)" stroke-width="10"/>

    <!-- Shield Interior Fill -->
    <path d="M 256 82 
             C 334 82, 376 108, 385 160 
             C 388 236, 350 338, 256 414 
             C 162 338, 124 236, 127 160 
             C 136 108, 178 82, 256 82 Z"
          fill="url(#shieldGrad)"/>

    <!-- Municipal Mural Crown (Coroa Mural de Contagem) -->
    <path d="M 206 50 
             L 214 74 L 230 62 L 256 80 L 282 62 L 298 74 L 306 50 
             L 292 42 L 256 50 L 220 42 Z"
          fill="url(#goldGrad)" stroke="#78350f" stroke-width="2"/>

    <!-- Barcode & Tech Asset Waves (Simbolizando Leitura Óptica & Ativos EMC) -->
    <g transform="translate(166, 160)">
      <!-- Vertical Barcode Stripes -->
      <rect x="10" y="20" width="8" height="90" rx="3" fill="#ffffff" opacity="0.95"/>
      <rect x="26" y="20" width="4" height="90" rx="2" fill="#ffffff" opacity="0.8"/>
      <rect x="38" y="20" width="12" height="90" rx="3" fill="#ffffff" opacity="0.95"/>
      <rect x="58" y="20" width="6" height="90" rx="2" fill="#ffffff" opacity="0.85"/>
      <rect x="72" y="20" width="16" height="90" rx="3" fill="#ffffff" opacity="0.95"/>
      <rect x="96" y="20" width="6" height="90" rx="2" fill="#ffffff" opacity="0.75"/>
      <rect x="110" y="20" width="12" height="90" rx="3" fill="#ffffff" opacity="0.95"/>
      <rect x="130" y="20" width="8" height="90" rx="2" fill="#ffffff" opacity="0.9"/>
      <rect x="146" y="20" width="14" height="90" rx="3" fill="#ffffff" opacity="0.95"/>
      <rect x="168" y="20" width="4" height="90" rx="2" fill="#ffffff" opacity="0.85"/>

      <!-- Glowing Red / Cyan Laser Scanner Sweep Beam -->
      <line x1="0" y1="65" x2="180" y2="65" stroke="#38bdf8" stroke-width="4" filter="url(#glow)"/>
      <circle cx="90" cy="65" r="5" fill="#ffffff"/>
    </g>

    <!-- Central Verified Badge / Checkmark -->
    <g transform="translate(256, 305)">
      <circle cx="0" cy="0" r="42" fill="url(#emeraldGrad)" stroke="#ffffff" stroke-width="5" filter="url(#shadow)"/>
      <!-- Crisp Checkmark -->
      <path d="M -18 -2 L -6 12 L 20 -14" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Bottom Municipal Banner: CONTAGEM -->
    <g transform="translate(256, 420)">
      <rect x="-115" y="-18" width="230" height="36" rx="18" fill="#0f172a" stroke="url(#goldGrad)" stroke-width="3" filter="url(#shadow)"/>
      <text x="0" y="6" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="900" fill="#fbbf24" letter-spacing="3.5">
        CONTAGEM • EMC
      </text>
    </g>
  </g>
</svg>