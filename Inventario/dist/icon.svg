<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Laser Beam Gradient -->
    <linearGradient id="laser" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0"/>
      <stop offset="15%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#34d399"/>
      <stop offset="85%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </linearGradient>

    <!-- Viewfinder Brackets Gradient -->
    <linearGradient id="bracketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="laserGlow" x="-20%" y="-100%" width="140%" height="300%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- App Icon Squircle Background -->
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <rect width="504" height="504" x="4" y="4" rx="112" fill="none" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.3"/>

  <!-- Scanner Viewfinder Brackets (Corners) -->
  <g stroke="url(#bracketGrad)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Top-Left -->
    <path d="M 120 168 V 136 C 120 120 120 120 136 120 H 168"/>
    <!-- Top-Right -->
    <path d="M 344 120 H 376 C 392 120 392 120 392 136 V 168"/>
    <!-- Bottom-Left -->
    <path d="M 120 312 V 344 C 120 360 120 360 136 360 H 168"/>
    <!-- Bottom-Right -->
    <path d="M 344 360 H 376 C 392 360 392 360 392 344 V 312"/>
  </g>

  <!-- Barcode Vertical Bars -->
  <g fill="#f8fafc">
    <rect x="160" y="160" width="14" height="160" rx="4"/>
    <rect x="186" y="160" width="8" height="160" rx="3"/>
    <rect x="206" y="160" width="22" height="160" rx="4"/>
    <rect x="240" y="160" width="10" height="160" rx="3"/>
    <rect x="262" y="160" width="18" height="160" rx="4"/>
    <rect x="292" y="160" width="8" height="160" rx="3"/>
    <rect x="312" y="160" width="22" height="160" rx="4"/>
    <rect x="346" y="160" width="12" height="160" rx="3"/>
  </g>

  <!-- Horizontal Laser Scan Line with Glow -->
  <g filter="url(#laserGlow)">
    <line x1="100" y1="240" x2="412" y2="240" stroke="url(#laser)" stroke-width="6" stroke-linecap="round"/>
    <line x1="120" y1="240" x2="392" y2="240" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Clean Bottom Label -->
  <rect x="146" y="398" width="220" height="42" rx="12" fill="#0284c7" fill-opacity="0.2" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.4"/>
  <text x="256" y="425" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="800" fill="#38bdf8" letter-spacing="3">COLETOR</text>
</svg>